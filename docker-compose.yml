services:
  playout:
    build: .
    ports:
      - "${PORT:-8080}:8080"   # web UI
      - "1935:1935"            # RTMP (relay ingest + pull; only used when MEDIAMTX_ENABLED)
      - "8888:8888"            # HLS (pull/playback; only used when MEDIAMTX_ENABLED)
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./soundboard:/app/soundboard
      - ./assets:/app/assets
      - ./mediamtx.yml:/app/mediamtx.yml
    environment:
      - PORT=${PORT:-8080}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - RTMP_URL=${RTMP_URL:-rtmp://localhost:1935/live/show}
      - MEDIAMTX_ENABLED=${MEDIAMTX_ENABLED:-true}
      - THEME=${THEME:-teal}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
    # Optional: a local .env is loaded when present (compose CLI), but its
    # absence must not break stack deploys (Portainer etc. have no .env file —
    # set variables in the stack UI instead).
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
