# Development setup: builds the `dev` image target, which bundles the MediaMTX
# relay so the stream can be viewed locally. Production uses the default image
# target (no relay) — see README "Deploy to production".
services:
  playout:
    build:
      context: .
      target: dev
    ports:
      - "${PORT:-8080}:8080"   # web UI
      - "1935:1935"            # RTMP (relay ingest + pull)
      - "8888:8888"            # HLS (pull/playback)
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./soundboard:/app/soundboard
      - ./assets:/app/assets
      - ./mediamtx.yml:/app/mediamtx.yml
    environment:
      - PORT=${PORT:-8080}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - RTMP_URL=${RTMP_URL:-rtmp://localhost:1935/live/show}
      - THEME=${THEME:-teal}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
    # Optional: loaded when present, but its absence doesn't break the deploy.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
